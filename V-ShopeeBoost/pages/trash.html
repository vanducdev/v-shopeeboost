<style>
  .trash-page-wrapper {
    display: flex;
    flex-direction: column;
    height: 100%;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .trash-page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .trash-page-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.4px;
    color: var(--text-primary);
    margin: 0;
  }
  .trash-page-subtitle {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 3px 0 0 0;
  }

  .trash-btn-action {
    height: 36px;
    padding: 0 14px;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .trash-btn-action:hover {
    border-color: var(--accent);
    color: var(--text-primary);
    background: var(--bg-hover);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
  }

  .trash-btn-empty {
    height: 36px;
    padding: 0 14px;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid rgba(239, 68, 68, 0.25);
    background: rgba(239, 68, 68, 0.06);
    color: #ef4444;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .trash-btn-empty:hover {
    background: rgba(239, 68, 68, 0.12);
    border-color: #ef4444;
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(239, 68, 68, 0.15);
  }

  .trash-body {
    flex: 1;
    padding: 20px 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .trash-table-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    overflow-x: auto;
    overflow-y: hidden;
    flex: 1;
  }

  .trash-table-header {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1.2fr;
    min-width: 680px;
    padding: 14px 20px;
    background: var(--bg-base);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  #trashListContainer {
    min-width: 680px;
  }

  /* ── Responsive Adaptations for Trash Page ── */
  @media screen and (max-width: 900px) {
    .trash-body {
      padding: 14px 16px;
    }
    .trash-page-header {
      padding: 12px 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
  }

  @media screen and (max-height: 740px) {
    .trash-page-header {
      padding: 10px 18px;
    }
    .trash-body {
      padding: 12px 18px;
    }
  }
</style>

<div class="trash-page-wrapper">
  <!-- Header -->
  <div class="trash-page-header">
    <div>
      <h1 class="trash-page-title">Thùng rác (Trash)</h1>
      <p class="trash-page-subtitle">Quản lý và khôi phục các Chrome Profiles đã xóa tạm thời</p>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <button class="trash-btn-action" id="btnGoBackProfiles">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>Quay lại Hồ sơ</span>
      </button>
      <button class="trash-btn-empty" id="btnEmptyTrash">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        <span>Dọn sạch thùng rác</span>
      </button>
    </div>
  </div>

  <!-- Table Card Content -->
  <div class="trash-body">
    <div class="trash-table-card">
      <div class="trash-table-header">
        <div>Tên Hồ Sơ</div>
        <div>Nhóm Phân Loại</div>
        <div>Ghi Chú</div>
        <div style="text-align: right; padding-right: 12px;">Thao Tác</div>
      </div>
      <div id="trashListContainer" style="display: flex; flex-direction: column; flex: 1;">
        <!-- Render động qua renderTrashList() -->
      </div>
    </div>
  </div>
</div>
