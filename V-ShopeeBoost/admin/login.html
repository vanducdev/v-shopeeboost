<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>V-ShopeeBoost - Đăng nhập Quản trị</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05050c;
      --panel: rgba(15, 15, 30, 0.7);
      --border: rgba(99, 102, 241, 0.2);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --red: #ef4444;
      --gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: 1;
    }

    .card {
      width: 420px;
      padding: 40px;
      background: var(--panel);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      z-index: 2;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input {
      width: 100%;
      height: 44px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 14px;
      color: #fff;
      font-family: inherit;
      font-size: 13.5px;
      transition: all 0.25s;
    }

    .input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn-submit {
      width: 100%;
      height: 44px;
      background: var(--gradient);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 4px 14px rgba(99,102,241,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 6px 20px rgba(99,102,241,0.4);
    }

    .alert {
      padding: 10px 14px;
      background: rgba(239, 68, 110, 0.15);
      border: 1px solid rgba(239, 68, 110, 0.3);
      color: var(--red);
      border-radius: 10px;
      font-size: 12.5px;
      margin-bottom: 20px;
      display: none;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
    }

    .back-link a {
      color: var(--primary);
      text-decoration: none;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="card">
    <div class="header">
      <div class="title">V-ShopeeBoost ADMIN</div>
      <div class="subtitle">Đăng nhập trang quản trị bản quyền</div>
    </div>

    <div id="alertBox" class="alert"></div>

    <div class="form-group">
      <label class="label">Tài khoản quản trị</label>
      <input type="text" id="usernameInput" class="input" placeholder="admin" value="admin" autocomplete="off">
    </div>

    <div class="form-group">
      <label class="label">Mật khẩu</label>
      <input type="password" id="passwordInput" class="input" placeholder="••••••••••••" autocomplete="off">
    </div>

    <button class="btn-submit" onclick="login()">Đăng nhập Hệ thống</button>

    <div class="back-link">
      <a href="#" onclick="goBackToApp()">← Quay lại ứng dụng chính</a>
    </div>
  </div>

  <script src="../i18n.js"></script>
  <script>
    void window.I18N?.init({ language: localStorage.getItem('app_lang') || 'vi' });
    const alertBox = document.getElementById('alertBox');
    
    async function login() {
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      
      if (!username || !password) {
        showAlert('Vui lòng điền đầy đủ tài khoản và mật khẩu!');
        return;
      }
      
      try {
        const res = await window.API.adminLogin(username, password);
        if (res.ok) {
          sessionStorage.setItem('isAdminLoggedIn', 'true');
          window.location.href = 'index.html';
        } else {
          showAlert(res.msg || 'Tài khoản hoặc mật khẩu sai!');
        }
      } catch (err) {
        showAlert('Lỗi: ' + err.message);
      }
    }

    function showAlert(msg) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
    }

    function goBackToApp() {
      // Vì đang trong app Electron, load file index.html ở root để về trang chủ
      window.location.href = '../index.html';
    }
  </script>
</body>
</html>
